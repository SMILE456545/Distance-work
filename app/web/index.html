<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="RemoteDesk — управление ноутбуком с телефона">
  <meta name="theme-color" content="#6E64F0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RemoteDesk">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RemoteDesk</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #6E64F0; }
    #rd-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #8279FA, #6E64F0 50%, #4B3FD6); color: #F6F6FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #rd-splash.hide { opacity: 0; pointer-events: none; }
    #rd-splash img { width: 112px; height: 112px; filter: drop-shadow(0 14px 24px rgba(24,15,112,.45)); }
    #rd-splash h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin: 14px 0 4px; }
    #rd-splash .sub { font-size: 14px; color: #E2DFFF; font-style: italic; margin-bottom: 32px; }
    #rd-bar { width: 220px; height: 4px; border-radius: 2px; background: #0C0C10; overflow: hidden; position: relative; }
    #rd-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #3CF06E; border-radius: 2px;
               transition: width .4s ease; }
    #rd-fill.indet { width: 35%; animation: rd-slide 1.2s ease-in-out infinite; }
    @keyframes rd-slide { 0% { left: -35%; } 100% { left: 100%; } }
    #rd-step { margin-top: 14px; font-size: 13px; color: #E2DFFF; min-height: 18px; text-align: center; padding: 0 24px; }
    #rd-slow { margin-top: 8px; font-size: 12px; color: #C9C4FF; text-align: center; padding: 0 32px; display: none; }
  </style>
</head>
<body>
  <div id="rd-splash">
    <img src="icons/Icon-192.png" alt="" width="112" height="112">
    <h1>RemoteDesk</h1>
    <div class="sub">Ваш компьютер — в кармане</div>
    <div id="rd-bar"><div id="rd-fill"></div></div>
    <div id="rd-step">Загрузка приложения…</div>
    <div id="rd-slow">Первый запуск может занять до минуты — дальше приложение откроется быстро.</div>
  </div>

  <script>
    (function () {
      var fill = document.getElementById('rd-fill');
      var step = document.getElementById('rd-step');
      var splash = document.getElementById('rd-splash');
      var done = false;
      function set(pct, text) {
        if (done) return;
        fill.classList.remove('indet');
        if (pct > parseFloat(fill.style.width || 0)) fill.style.width = pct + '%';
        if (text) step.textContent = text;
      }
      set(8, 'Загрузка приложения…');
      // follow which files have finished downloading
      try {
        new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) {
            var n = e.name;
            if (/flutter_bootstrap\.js/.test(n)) set(15, 'Загрузка приложения…');
            else if (/main\.dart\.(js|mjs|wasm)/.test(n)) set(55, 'Загрузка графики…');
            else if (/\.wasm/.test(n)) set(85, 'Запуск…');
            else if (/canvaskit|skwasm/.test(n)) set(40, 'Загрузка графики…');
            else if (/AssetManifest|FontManifest|\.otf|\.ttf/.test(n)) set(92, 'Почти готово…');
          });
        }).observe({ type: 'resource', buffered: true });
      } catch (e) {
        fill.classList.add('indet');
      }
      // the bar creeps forward slowly so it never looks frozen
      var creep = setInterval(function () {
        var w = parseFloat(fill.style.width || 0);
        if (w < 80) set(w + 0.6);
      }, 400);
      setTimeout(function () { if (!done) document.getElementById('rd-slow').style.display = 'block'; }, 6000);
      window.addEventListener('flutter-first-frame', function () {
        set(100, 'Готово');
        done = true;
        clearInterval(creep);
        setTimeout(function () { splash.classList.add('hide'); }, 150);
        setTimeout(function () { splash.remove(); }, 600);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
