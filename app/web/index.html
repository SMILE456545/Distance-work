  <script>
    (function () {
      var fill = document.getElementById('rd-fill');
      var step = document.getElementById('rd-step');
      var splash = document.getElementById('rd-splash');
      var done = false;
      function set(pct, text) {
        if (done) return;
        fill.classList.remove('indet');
        if (pct > parseFloat(fill.style.width || 0)) fill.style.width = pct + '%';
        if (text) step.textContent = text;
      }
      set(8, 'Загрузка приложения…');
      // follow which files have finished downloading
      try {
        new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) {
            var n = e.name;
            if (/flutter_bootstrap\.js/.test(n)) set(15, 'Загрузка приложения…');
            else if (/main\.dart\.(js|mjs|wasm)/.test(n)) set(55, 'Загрузка графики…');
            else if (/\.wasm/.test(n)) set(85, 'Запуск…');

          });
        }).observe({ type: 'resource', buffered: true });
      } catch (e) {
        fill.classList.add('indet');

      // the bar creeps forward slowly so it never looks frozen
      var creep = setInterval(function () {
        var w = parseFloat(fill.style.width || 0);

      setTimeout(function () { if (!done) document.getElementById('rd-slow').style.display = 'block'; }, 6000);

        set(100, 'Готово');
        done = true;
        clearInterval(creep);
        setTimeout(function () { splash.classList.add('hide'); }, 150);

      });
